        .custom-dropdown {
    background-color: #fffdf7;
    border-radius: 8px;
    min-width: 130px;
    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
    padding: 0px !important;
  }

  .custom-dropdown .dropdown-item {
    font-weight: 500;
    width: 30px;
    padding: 0px;
    color: #333;
  }

  .custom-dropdown .dropdown-item:hover {
    background-color: transparent;
    color: #000;
  }

        .publish-btn {
            width: 120px;
            border-radius: 5px;
            padding: 8px 12px;
            border: 2px solid #ccc;
            background-color: #f6f3f3;
            color: #333;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }

        .publish-btn:hover {
            background: #0072ff;
            color: white;
            transition: all 0.3s ease-in-out;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="logo"><a href="{% url 'homepage' %}"><strong>MindSET Matters</strong></a></div>
        <div class="navlinks">
            <a href="{% url 'homepage' %}" class="create-post-button">Home</a>
            <a href="{% url 'question_list' %}" class="create-post-button">FAQ</a>
            <a href="{% url 'post_list' %}" class="create-post-button">Blog</a>
            <!-- <a href="{% url 'create_post' %}" class="create-post-button">Write Blog</a> -->
           
            <div class="btn-group">
                <button type="button" class="btn btn-secondary" data-bs-toggle="modal" data-bs-target="#questionModal">
                    Add Question
                </button>
                <button type="button" class="btn btn-secondary dropdown-toggle dropdown-toggle-split"
                    data-bs-toggle="dropdown" aria-expanded="false">
                    <span class="visually-hidden">Toggle Dropdown</span>
                </button>
                <ul class="dropdown-menu custom-dropdown">
                    <li><a class="dropdown-item no-padding" href="#" data-bs-toggle="modal" data-bs-target="#blogModal">
                        Create Blog
                      </a></li>
                </ul>
            </div>
            <!-- <a href="/ask/"><button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#questionModal">Ask Question</button></a> -->
        </div>

        <div class="userprofilelogo">
            <a href="{% url 'user_profile' user.id %}">
                <!-- <img src="{{ user_data.profile_image.url }}" alt="Profile Image" style="width: 150px; height: 150px; border-radius: 50%;"> -->
                <strong>{{ user.username|first }}</strong>
            </a><br>
        </div>
    </nav>

    <!-- Navigation -->
    <div class="main">
        

        <!-- Error Message -->
        {% if error_message %}
        <div class="error-message">{{ error_message }}</div>
        {% endif %}
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="modal fade" id="questionModal" tabindex="-1">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">Add Question</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <!-- <input type="text" name="title" class="title-input" placeholder="Question Title" required
                        value="{{ form.title.value|default_if_none:'' }}"> -->
                            <textarea type="text" name="title" class="form-control" rows="3"
                                placeholder="Start your question with 'What', 'How', 'Why', etc." required
                                value="{{ form.title.value|default_if_none:'' }}"></textarea>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-primary">Add Question</button>
                        </div>
                    </div>
                </div>
            </div>
        </form>


        {% if error_message %}
        <div class="error-message">{{ error_message }}</div>
        {% endif %}
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="modal fade" id="blogModal" tabindex="-1">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">Add Blog </h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <!-- <input type="text" name="title" class="title-input" placeholder="Question Title" required
                        value="{{ form.title.value|default_if_none:'' }}"> -->
                        <textarea type="text" name="title" class="form-control" rows="1"
                        placeholder="Enter Title" required
                        value="{{ form.title.value|default_if_none:'' }}"></textarea>
                        <div style="margin-top: 20px; font-family: Arial, sans-serif; font-size: 18px; color:#999;">
                            <label for="category" style="margin-right: 10px;">Select Category:</label>
                            {{ form.category }}
                        </div>
                            <textarea type="text" name="title" class="form-control" style="margin-top: 20px;" rows="4"
                                placeholder="Tell your story..." required
                                value="{{ form.title.value|default_if_none:'' }}">{{ form.content.value|default_if_none:'' }}</textarea>
                                <div style="margin: 30px 0px; font-family: Arial, sans-serif; font-size: 18px;color: #999; display: flex; align-items: center;">
                                    <label for="image" style="margin-right: 10px; color: #999; width: 100%;white-space: nowrap;">Upload Image:</label>
                                    <input type="file" id="image" name="image" accept="image/*" style="margin-left: 45px; color: #999;">
                                </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-primary">Add Blog</button>
                        </div>
                    </div>
                </div>
            </div>
        </form>




        <!-- Forms Container -->
        <div>
            <form id="question-form" method="POST" >
                {% csrf_token %}
                <div class="editor-container">
                    <input type="text" name="title" class="title-input" placeholder="Question Title" required
                        value="{{ form.title.value|default_if_none:'' }}">
                   
                    <div class="button-container">
                        <button class="publish-btn" type="submit">Publish</button>
                    </div>

                </div>
            </form>
        </div>
    </div>

 
   
</body>

</html>
